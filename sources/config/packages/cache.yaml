framework:
    cache:
        # Unique name of your app: used to compute stable namespaces for cache keys.
        #prefix_seed: your_vendor_name/app_name

        # Le cache applicatif est stocké en base (table `cache_items`, créée par
        # migration) et non sur le système de fichiers : l'adaptateur fichier écrit
        # un fichier par entrée et ne supprime jamais les expirées, ce qui sature le
        # quota d'inodes de l'hébergement mutualisé (incident Bibliotheque : 127 000
        # fichiers dans var/cache/prod/pools). Concerne notamment le rate limiter
        # d'inscription (une entrée par IP).
        # Purge des entrées expirées : `php bin/console cache:pool:prune`.
        app: cache.adapter.doctrine_dbal
        default_doctrine_dbal_provider: database_connection

        # Other options include:

        # Redis
        #app: cache.adapter.redis
        #default_redis_provider: redis://localhost

        # APCu (not recommended with heavy random-write workloads as memory fragmentation can cause perf issues)
        #app: cache.adapter.apcu

        # Namespaced pools use the above "app" backend by default
        #pools:
            #my.dedicated.cache: null
